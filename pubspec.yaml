name: carlton_leisure_app
description: Carlton Leisure flight, hotel & car booking app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Routing
  go_router: ^14.2.0

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Networking
  dio: ^5.5.0
  cookie_jar: ^4.0.8
  pretty_dio_logger: ^1.3.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Forms & validation
  flutter_form_builder: ^10.0.0
  form_builder_validators: ^11.2.0

  # UI utilities
  google_fonts: ^6.2.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # Payments
  flutter_stripe: ^11.1.0
  flutter_paypal_payment: ^1.0.7

  # PDF generation & file handling
  pdf: ^3.1.2
  path_provider: ^2.1.2
  open_filex: ^4.3.2

  # UI utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: CarltonSans
  #     fonts:
  #       - asset: assets/fonts/CarltonSans-Regular.ttf
  #       - asset: assets/fonts/CarltonSans-Bold.ttf
  #         weight: 700
